[workspace]
resolver = "2"
members = [
    "crates/*",
    "examples/*",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
lto = true

# Size-optimized profile for the WASM example client (see Makefile.toml).
[profile.wasm-release]
inherits = "release"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[workspace.dependencies]
derive_more = { version = "2.1", features = ["as_ref"] }
env_logger = "0.11"
futures = "0.3"
hypertext = { git = "https://github.com/vidhanio/hypertext.git", version = "0.12", features = ["axum", "htmx"] }
js-sys = "0.3"
strum = { version = "0.28", features = ["derive"] }
tiny_file_server = "0.1"
wingy-hypertext = { path = "crates/lib" }
wingy-hypertext-macros = { path = "crates/macros" }
wingy-hypertext-web = { path = "crates/web" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-dom = "2.0"
web-sys = "0.3"
