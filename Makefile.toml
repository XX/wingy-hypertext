[config]
default_to_workspace = false
additional_profiles = ["debug"]

[env]
TARGET_DIR = "target"

[tasks.choose-profile.env]
PROFILE = "release"
PROFILE_BUILD_DIR = "${PROFILE}"

    [tasks.choose-profile.env.debug]
    PROFILE = "dev"
    PROFILE_BUILD_DIR = "debug"

# NOTE: `web_sys_unstable_apis` cfg enables the Web Animations bindings in web-sys used by `wingy-hypertext-web`.
[tasks.choose-profile-web.env]
RUSTFLAGS = "-Copt-level=z --cfg=web_sys_unstable_apis"
PROFILE = "wasm-release"
PROFILE_BUILD_DIR = "${PROFILE}"

    [tasks.choose-profile-web.env.debug]
    RUSTFLAGS = "--cfg=web_sys_unstable_apis"
    PROFILE = "dev"
    PROFILE_BUILD_DIR = "debug"


[tasks.build-client]
command = "cargo"
toolchain = "stable"
args = ["build", "-p", "example-client", "--target", "wasm32-unknown-unknown", "--profile", "${PROFILE}"]
dependencies = ["choose-profile-web"]

[tasks.copy-static-files]
script_runner = "@duckscript"
script = '''
rm -r ${TARGET_DIR}/web
glob_cp webassets/**/* ${TARGET_DIR}/web/
glob_cp examples/client/webassets/**/* ${TARGET_DIR}/web/
'''

[tasks.deploy-client]
command = "wasm-bindgen"
args = [
    "--target",
    "web",
    "--no-typescript",
    "--remove-name-section",
    "--remove-producers-section",
    "--out-dir",
    "${TARGET_DIR}/web/dist",
    "--out-name",
    "client",
    "${TARGET_DIR}/wasm32-unknown-unknown/${PROFILE_BUILD_DIR}/example_client.wasm",
]
dependencies = ["copy-static-files"]

# Shrinks the deployed wasm with binaryen's `wasm-opt`; skipped for debug builds.
[tasks.optimize-client]
condition = { env = { "PROFILE" = "wasm-release" } }
command = "wasm-opt"
args = [
    "-Oz",
    "--strip-debug",
    "-o",
    "${TARGET_DIR}/web/dist/client_bg.wasm",
    "${TARGET_DIR}/web/dist/client_bg.wasm",
]
dependencies = ["deploy-client"]

[tasks.client]
dependencies = ["build-client", "deploy-client", "optimize-client"]


[tasks.run-server]
command = "cargo"
toolchain = "stable"
args = ["run", "-p", "example-server", "--profile", "${PROFILE}"]
dependencies = ["choose-profile"]

[tasks.run]
run_task = [
    { name = ["run-server"] },
]
dependencies = ["client"]

[tasks.watch]
command = "watchexec"
args = ["-r", "-w", "examples/client", "cargo", "make", "client"]


[tasks.fmt-check]
toolchain = "nightly"
command = "cargo"
args = ["fmt", "--check"]

[tasks.clippy]
toolchain = "stable"
command = "cargo"
args = ["clippy", "--all-targets", "--", "-D", "warnings"]

[tasks.lint]
run_task = [
    { name = ["clippy"] },
]
dependencies = ["fmt-check"]

[tasks.lint-test]
toolchain = "stable"
command = "cargo"
args = ["test"]
dependencies = ["lint"]
