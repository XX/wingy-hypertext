[config]
default_to_workspace = false
additional_profiles = ["debug"]

[env]
TARGET_DIR = "target"

# NOTE: `web_sys_unstable_apis` cfg enables the Web Animations bindings in web-sys used by `wingy-hypertext-web`.
[tasks.choose-profile.env]
RUSTFLAGS = "--cfg=web_sys_unstable_apis"
PROFILE = "release"
PROFILE_BUILD_DIR = "${PROFILE}"

    [tasks.choose-profile.env.debug]
    PROFILE = "dev"
    PROFILE_BUILD_DIR = "debug"

[tasks.choose-profile-web.env]
RUSTFLAGS = "-Copt-level=z --cfg=web_sys_unstable_apis"
PROFILE = "wasm-release"
PROFILE_BUILD_DIR = "${PROFILE}"

    [tasks.choose-profile-web.env.debug]
    RUSTFLAGS = "--cfg=web_sys_unstable_apis"
    PROFILE = "dev"
    PROFILE_BUILD_DIR = "debug"


[tasks.build-client]
command = "cargo"
toolchain = "stable"
args = ["build", "-p", "example-client", "--target", "wasm32-unknown-unknown", "--profile", "${PROFILE}"]
dependencies = ["choose-profile-web"]

[tasks.clean-static]
script_runner = "@duckscript"
script = '''
keep = set ${TARGET_DIR}/web/dist
entries = glob_array ${TARGET_DIR}/web/*
for entry in ${entries}
    if not equals ${entry} ${keep}
        rm -r ${entry}
    end
end
'''

[tasks.clean-dist]
script_runner = "@duckscript"
script = '''
rm -r ${TARGET_DIR}/web/dist
'''

[tasks.copy-static]
script_runner = "@duckscript"
script = '''
glob_cp webassets/**/* ${TARGET_DIR}/web/
glob_cp examples/client/webassets/**/* ${TARGET_DIR}/web/
'''
dependencies = ["clean-static"]

[tasks.deploy-client]
command = "wasm-bindgen"
args = [
    "--target",
    "web",
    "--no-typescript",
    "--remove-name-section",
    "--remove-producers-section",
    "--out-dir",
    "${TARGET_DIR}/web/dist",
    "--out-name",
    "client",
    "${TARGET_DIR}/wasm32-unknown-unknown/${PROFILE_BUILD_DIR}/example_client.wasm",
]
dependencies = ["clean-dist"]

# Shrinks the deployed wasm with binaryen's `wasm-opt`; skipped for debug builds.
[tasks.optimize-client]
condition = { env = { "PROFILE" = "wasm-release" } }
command = "wasm-opt"
args = [
    "-Oz",
    "--strip-debug",
    "-o",
    "${TARGET_DIR}/web/dist/client_bg.wasm",
    "${TARGET_DIR}/web/dist/client_bg.wasm",
]


[tasks.client]
condition = { files_modified = { input = [
    "${TARGET_DIR}/wasm32-unknown-unknown/${PROFILE_BUILD_DIR}/example_client.wasm",
], output = [
    "${TARGET_DIR}/web/dist/client_bg.wasm",
] } }
run_task = { name = ["deploy-client", "optimize-client"] }
dependencies = ["build-client", "copy-static"]


[tasks.run-server]
command = "cargo"
toolchain = "stable"
args = ["run", "-p", "example-server", "--profile", "${PROFILE}"]
dependencies = ["choose-profile"]

[tasks.run]
run_task = "run-server"
dependencies = ["client"]

[tasks.watch]
command = "watchexec"
args = ["-r", "-w", "examples/client", "-w", "webassets", "cargo", "make", "-p", "debug", "client"]


[tasks.fmt-check]
toolchain = "nightly"
command = "cargo"
args = ["fmt", "--check"]

[tasks.clippy]
toolchain = "stable"
command = "cargo"
args = ["clippy", "--all-targets", "--", "-D", "warnings"]
dependencies = ["choose-profile"]

[tasks.lint]
run_task = "clippy"
dependencies = ["fmt-check"]

[tasks.lint-test]
toolchain = "stable"
command = "cargo"
args = ["test"]
dependencies = ["lint"]
