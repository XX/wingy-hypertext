[package]
name = "example-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hypertext = { workspace = true }
iconic = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-dom = { workspace = true }
web-sys = { workspace = true, features = [
    "Document",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "HtmlInputElement",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "Node",
    "Window",
] }
wingy-hypertext = { workspace = true }
wingy-hypertext-web = { workspace = true }
