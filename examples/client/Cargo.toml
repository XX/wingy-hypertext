[package]
name = "example-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hypertext = { workspace = true }
wingy-hypertext = { workspace = true }
wingy-hypertext-web = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-dom = { workspace = true }

[dependencies.web-sys]
workspace = true
features = [
    "Document",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "HtmlInputElement",
    "Node",
    "Window",
]
